<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Hub Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* EXACT colors from your screenshot */
            --bg-deep: #0a0a0a;
            --bg-card: #141414;
            --text-main: #f5f5f5;
            --text-fade: #a1a1a1;
            --accent-glow: #f39c12; 
            --accent-hover: #e67e22;
            --button-main: #f39c12; /* Amber Button */
            --button-text: #000000; /* Black text on button */
            --border-line: #333333;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header Section --- */
        .app-header {
            text-align: center;
            width: 100%;
            margin-bottom: 30px;
        }

        .master-heading {
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin: 0 0 8px 0;
            color: var(--accent-glow);
        }

        .app-subtitle {
            color: var(--text-fade);
            font-size: 14px;
            margin: 5px 0 0 0;
        }

        .section-heading {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-line);
            width: 100%;
            text-align: left;
        }

        /* --- SINGLE COLUMN FEED --- */
        .video-feed-container {
            width: 100%;
            display: flex;
            flex-direction: column; /* This guarantees a single vertical column */
            gap: 25px; 
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .video-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-line);
        }

        /* Huge 16:9 Edge-to-Edge Thumbnail */
        .thumbnail-wrapper {
            width: 100%;
            position: relative;
            padding-top: 56.25%; 
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #222 0%, #111 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-placeholder-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0.6;
        }

        .source-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--accent-glow);
            border-radius: 6px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .badge-text {
            color: var(--text-main);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .video-title {
            font-size: 18px; /* Larger font for single feed */
            font-weight: 700;
            margin: 0;
            line-height: 1.4;
        }

        .video-meta {
            color: var(--text-fade);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* --- Big Amber Button --- */
        .btn-cta {
            width: 100%;
            background-color: var(--button-main);
            color: var(--button-text);
            border: none;
            padding: 16px 10px; /* Taller button */
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-cta:active {
            transform: scale(0.97);
            background-color: var(--accent-hover);
        }

        /* --- Gateway/Ad Overlay --- */
        .gateway-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .gateway-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .gateway-title {
            color: var(--accent-glow);
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }

        .gateway-text {
            color: var(--text-main);
            font-size: 15px;
            margin: 0 0 25px 0;
        }

        .loading-spinner {
            width: 45px;
            height: 45px;
            border: 4px solid var(--border-line);
            border-top: 4px solid var(--accent-glow);
            border-radius: 50%;
            animation: spinGateway 1s linear infinite;
        }

        @keyframes spinGateway {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .utility-box {
            text-align: center;
            color: var(--text-fade);
            font-size: 12px;
            margin-top: 20px;
            width: 100%;
            border-top: 1px solid var(--border-line);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <h1 class="master-heading">PREMIUM VIDEO</h1>
            <p class="app-subtitle">Official Cloud Library Gateway</p>
        </header>

        <div style="width: 100%;">
            <h2 class="section-heading">LATEST VIDEOS</h2>
        </div>

        <div id="video-feed" class="video-feed-container"></div>

        <footer class="utility-box">
            Media Network Hub | Live Premium Streams
        </footer>
    </div>

    <div id="gateway-overlay" class="gateway-overlay">
        <h3 class="gateway-title">Secure Gateway</h3>
        <p class="gateway-text">Verifying secure database mirror...</p>
        <div class="loading-spinner"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Downloader Bot Link
        const BOT2_USERNAME = "video699bot"; 

        tg.ready();
        tg.expand();

        const VIDEOS = [
            { id: 'v1', title: 'Trending Action Drop Movie 01', size: '1.2 GB', duration: '1h 45m', source: 'TERABOX', sourceIcon: '🌐', rawUrl: 'https://terabox.com/s/1example_link_A' },
            { id: 'v2', title: 'Exclusive Full Series Episode (S01E01)', size: '450 MB', duration: '45m', source: 'DISKWALA', sourceIcon: '📂', rawUrl: 'https://diskwala.com/f/2example_link_B' },
            { id: 'v3', title: 'Premium Multi-Audio Hollywood Feature', size: '2.1 GB', duration: '2h 15m', source: 'TERABOX', sourceIcon: '🌐', rawUrl: 'https://terabox.com/s/3example_link_C' },
            { id: 'v4', title: 'New Anime Special Release [1080p Ultra]', size: '350 MB', duration: '24m', source: 'DISKWALA', sourceIcon: '📂', rawUrl: 'https://diskwala.com/f/4example_link_D' }
        ];

        const feedContainer = document.getElementById('video-feed');
        const gatewayOverlay = document.getElementById('gateway-overlay');

        VIDEOS.forEach(vid => {
            const cardMarkup = `
                <div class="video-card">
                    <div class="thumbnail-wrapper">
                        <div class="thumbnail-placeholder-icon">🎬</div>
                        <div class="source-badge">
                            <span class="badge-text">${vid.sourceIcon} ${vid.source}</span>
                        </div>
                    </div>
                    
                    <div class="video-info">
                        <h4 class="video-title">${vid.title}</h4>
                        <div class="video-meta">
                            <span>📦 ${vid.size}</span>
                            <span>⏱️ ${vid.duration}</span>
                        </div>
                    </div>
                    
                    <button class="btn-cta" onclick="handleSecureWatch('${vid.rawUrl}')">
                        WATCH / DOWNLOAD
                    </button>
                </div>
            `;
            feedContainer.insertAdjacentHTML('beforeend', cardMarkup);
        });

        function encodeUrl(url) {
            return btoa(unescape(encodeURIComponent(url))).replace(/=/g, "");
        }

        function handleSecureWatch(rawSourceUrl) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const encodedPayload = encodeUrl(rawSourceUrl);
            const finalBot2DeepLink = `https://t.me/${BOT2_USERNAME}?start=${encodedPayload}`;

            gatewayOverlay.classList.add('show');

            setTimeout(() => {
                window.location.href = finalBot2DeepLink;
            }, 1500); 
        }
    </script>
</body>
</html>
