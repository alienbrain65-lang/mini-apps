<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #f39c12; /* Premium Orange */
            --button-bg: #2d2d2d;
            --button-hover: #3d3d3d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .header h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .video-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .video-badge {
            background-color: var(--accent-color);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            background-color: var(--button-bg);
            color: var(--text-primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .btn:active {
            background-color: var(--button-hover);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-primary:active {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Media Hub</h1>
        <p>Premium Cloud Streaming & Downloads</p>
    </div>

    <div class="video-list">
        <div class="video-card">
            <div class="video-header">
                <h2 class="video-title">Sample Movie Drop 01</h2>
                <span class="video-badge">TeraBox</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="handleAction('Watch', 'link1')">👁️ Watch</button>
                <button class="btn" onclick="handleAction('Download', 'link1')">📥 Download</button>
            </div>
        </div>

        <div class="video-card">
            <div class="video-header">
                <h2 class="video-title">Exclusive Series S01E01</h2>
                <span class="video-badge">DiskWala</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="handleAction('Watch', 'link2')">👁️ Watch</button>
                <button class="btn" onclick="handleAction('Download', 'link2')">📥 Download</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Tells Telegram the app is ready and expands it to full height
        tg.ready();
        tg.expand();

        // Optional: Match the app background to the user's Telegram theme
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#121212';
        document.body.style.color = tg.themeParams.text_color || '#ffffff';

        // Function to handle button clicks
        function handleAction(actionType, videoId) {
            // Give the user tactile feedback when they click
            tg.HapticFeedback.impactOccurred('light');
            
            // In a fully dynamic app, this would send data back to your bot.
            // For now, it shows a beautiful Telegram native alert.
            tg.showAlert(`Preparing your ${actionType} link... Redirecting to secure gateway!`);
            
            // Example of sending data back to the Python bot:
            // tg.sendData(JSON.stringify({ action: actionType, id: videoId }));
        }
    </script>
</body>
</html>
