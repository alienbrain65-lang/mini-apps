<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Video Feed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Exact colors from your reference image */
            --bg-main: #0B1121;
            --bg-card: #151C2C;
            --text-primary: #ffffff;
            --text-secondary: #8B98A9;
            --btn-blue: #1D4ED8;
            --btn-hover: #1E40AF;
            --nav-bg: #111827;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-nav {
            width: 100%;
            background-color: var(--nav-bg);
            padding: 15px 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #1F2937;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .top-nav span {
            color: #60A5FA; /* Light blue username text */
            font-size: 20px;
            font-weight: 700;
        }

        .app-container {
            width: 100%;
            max-width: 500px; /* Keeps it looking like a phone even on desktop */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Text */
        .header-title {
            font-size: 36px;
            font-weight: 800;
            margin: 10px 0 5px 0;
            text-align: center;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin: 0 0 30px 0;
            text-align: center;
        }

        /* Single Column Feed */
        .video-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Space between rows */
            margin-bottom: 30px;
        }

        /* The Card */
        .video-card {
            background-color: var(--bg-card);
            border-radius: 16px; /* Smooth rounded corners */
            overflow: hidden; /* Forces image to round at the top */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* Edge-to-edge thumbnail */
        .thumbnail-container {
            width: 100%;
            height: 220px; /* Fixed height for a cinematic look */
            background-color: #000;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills the box perfectly */
        }

        /* Bottom content area */
        .card-content {
            padding: 16px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 16px 0;
            line-height: 1.3;
        }

        /* Bright Blue Button */
        .btn-watch {
            width: 100%;
            background-color: var(--btn-blue);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-watch:active {
            transform: scale(0.98);
            background-color: var(--btn-hover);
        }

        .footer {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* SVG Icon for Button */
        .icon-send {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

    </style>
</head>
<body>

    <div class="top-nav">
        <span>@video699bot</span>
    </div>

    <div class="app-container">
        
        <h1 class="header-title">Latest Videos</h1>
        <p class="header-subtitle">Watch premium videos</p>

        <div id="video-feed" class="video-feed"></div>

        <div class="footer">@video699bot</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BOT2_USERNAME = "video699bot"; 

        tg.ready();
        tg.expand();

        // Sample Data - I added a placeholder image URL so you can see the layout!
        const VIDEOS = [
            { 
                id: '1', 
                title: '029(3).mp4', 
                rawUrl: 'https://terabox.com/s/example1',
                thumbUrl: 'https://images.unsplash.com/photo-1616530940355-351fabd9524b?w=800&q=80' // Placeholder movie image
            },
            { 
                id: '2', 
                title: 'New_Release_Full.mp4', 
                rawUrl: 'https://diskwala.com/f/example2',
                thumbUrl: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=800&q=80' // Placeholder movie image
            }
        ];

        const feedContainer = document.getElementById('video-feed');

        // Render the cards exactly like the reference image
        VIDEOS.forEach(vid => {
            const cardMarkup = `
                <div class="video-card">
                    <div class="thumbnail-container">
                        <img src="${vid.thumbUrl}" alt="Video Thumbnail">
                    </div>
                    <div class="card-content">
                        <h4 class="video-title">${vid.title}</h4>
                        <button class="btn-watch" onclick="handleSecureWatch('${vid.rawUrl}')">
                            <svg class="icon-send" viewBox="0 0 24 24">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                            Watch / Download
                        </button>
                    </div>
                </div>
            `;
            feedContainer.insertAdjacentHTML('beforeend', cardMarkup);
        });

        function encodeUrl(url) {
            return btoa(unescape(encodeURIComponent(url))).replace(/=/g, "");
        }

        function handleSecureWatch(rawSourceUrl) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const encodedPayload = encodeUrl(rawSourceUrl);
            const finalBot2DeepLink = `https://t.me/${BOT2_USERNAME}?start=${encodedPayload}`;

            // Instantly redirect to bot
            window.location.href = finalBot2DeepLink;
        }
    </script>
</body>
</html>
